---
name: FreeBSD build

on:
  workflow_dispatch:
    inputs:
      krb_impl:
        description: 'Kerberos implementation (MIT or Heimdal)'
        required: true
        type: string
  workflow_call:
    inputs:
      krb_impl:
        description: 'Kerberos implementation (MIT or Heimdal)'
        required: true
        type: string

jobs:
  freebsdbuild:
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    name: Build on FreeBSD
    env:
      KRB_IMPL: ${{ github.event.inputs.krb_impl || inputs.krb_impl }}
    strategy:
      matrix:
        arch: [x86-64, arm64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Cross Platform Action
        uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: freebsd
          # FreeBSD 13.x is EOL (2026-04): its quarterly pkg repos have been
          # decommissioned and the 13.2 VM can no longer install cmake/krb5.
          # 14.3 is the closest still-supported release.
          version: "14.3"
          shell: bash
          sync_files: true
          architecture: ${{ matrix.arch }}
          environment_variables: KRB_IMPL
          run: |
            sudo pkg install -y cmake
            if [ "${KRB_IMPL}" = "MIT" ]; then
              sudo pkg install -y krb5
            fi
            ./build.bsd.sh
      - name: Store executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "n2os_smb_client.bsd_${{ matrix.arch }}"
          path: bin/n2os_smb_client.bsd*
